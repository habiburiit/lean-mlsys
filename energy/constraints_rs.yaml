mapspace:
  constraints:
  - {type: datatype, target: PsumRegFile,   bypass: [Inputs, Weights], keep: [Outputs]}
  - {type: datatype, target: WeightRegFile, bypass: [Inputs, Outputs], keep: [Weights]}
  - {type: datatype, target: InputRegFile,  bypass: [Weights, Outputs], keep: [Inputs]}
  - {type: datatype, target: DummyBuffer,   bypass: [Inputs, Outputs, Weights]}
  - {type: datatype, target: GlobalBuffer,  bypass: [Weights], keep: [Inputs, Outputs]}
  - {type: spatial,  target: DummyBuffer,  split: 4, permutation: NPQR SCK, factors: N1 P1 Q1 R1 S0}
  - {type: spatial,  target: GlobalBuffer, split: 7, permutation: NCPRS QK, factors: N1 C1 P1 R1 S1}
  - {type: temporal, target: PsumRegFile,   permutation: NCPQRS K, factors: N1 C1 P1 Q1 R1 S1}
  - {type: temporal, target: WeightRegFile, permutation: NKPQS CR, factors: N1 K1 P1 Q1 S1 R0}
  - {type: temporal, target: InputRegFile,  permutation: NKCPQRS, factors: N1 K1 C1 P1 Q1 R1 S1}
  - {type: temporal, target: DummyBuffer,   permutation: NKCPQRS, factors: N1 K1 C1 P1 Q1 R1 S1}
  - {type: temporal, target: GlobalBuffer,  permutation: QRSC PNK, factors: Q1 R1 S1 C1 P0}
  - {type: temporal, target: DRAM,          permutation: RSP CKNQ, factors: R1 S1 P1}
